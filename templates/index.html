<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Gerador de Cartaz de Oferta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .modelo-thumb { width: 100px; height: auto; border: 2px solid #ccc; margin-right: 10px; }
    .form-section { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  </style>
</head>
<body class="bg-light">
<div class="container py-5">
  <div class="form-section">
    <h2 class="mb-4">🛒 Gerador de Cartaz de Oferta</h2>
    <form action="/adicionar" method="post">
      <div class="mb-3">
        <label class="form-label">Nome do Produto</label>
        <input type="text" name="produto" class="form-control" required>
      </div>
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Preço Normal</label>
          <input type="text" name="preco_normal" class="form-control" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Preço em Oferta</label>
          <input type="text" name="preco_oferta" class="form-control" required>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label">Tipo</label>
        <select name="tipo" class="form-select">
          <option value="UN">Unidade</option>
          <option value="KG">Kg</option>
        </select>
      </div>
      <div class="mb-3">
        <label class="form-label">Validade</label>
        <input type="text" name="validade" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Modelo</label><br>
        <div class="d-flex">
          <label class="me-3">
            <input type="radio" name="modelo" value="modelo01.jpg" checked>
            <img src="/static/modelos/modelo01.jpg" class="modelo-thumb">
          </label>
          <label class="me-3">
            <input type="radio" name="modelo" value="modelo02.jpg">
            <img src="/static/modelos/modelo02.jpg" class="modelo-thumb">
          </label>
          <label>
            <input type="radio" name="modelo" value="modelo03.jpg">
            <img src="/static/modelos/modelo03.jpg" class="modelo-thumb">
          </label>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">➕ Adicionar à fila</button>
      <a href="/gerar" class="btn btn-success ms-2">📄 Gerar todos os cartazes</a>
      <a href="/limpar" class="btn btn-outline-danger ms-2">🗑️ Limpar fila</a>
    </form>
  </div>

  {% if cartazes %}
  <div class="mt-4">
    <h5>🧾 Cartazes na fila:</h5>
    <ul class="list-group">
      {% for c in cartazes %}
      <li class="list-group-item">
        <strong>{{ c.produto }}</strong> - de R$ {{ c.preco_normal }} por R$ {{ c.preco_oferta }}/{{ c.tipo }} ({{ c.validade }})
      </li>
      {% endfor %}
    </ul>
  </div>
  {% endif %}
</div>
</body>
</html>
